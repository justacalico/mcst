name: mcst_frontend
description: "mcst — self-hosted Minecraft server panel."
publish_to: "none"
version: 0.2.0+3

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.0
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  file_picker: ^10.0.0
  fl_chart: ^0.70.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
