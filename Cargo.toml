[package]
name = "mcst"
version = "0.2.2"
edition = "2021"
rust-version = "1.85.0"
license = "AGPL-3.0-only"
description = "A self-hosted, single-binary panel for creating and managing Minecraft servers."
repository = "https://gitlab.com/HttpAnimations/mcst"
homepage = "https://gitlab.com/HttpAnimations/mcst"

[[bin]]
name = "mcst"
path = "src/main.rs"

[lib]
name = "mcst"
path = "src/lib.rs"

[workspace]
resolver = "2"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "fs", "cors", "limit", "set-header"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-trait = "0.1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono", "uuid", "migrate"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Auth & crypto
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
constant_time_eq = "0.3"
sha2 = "0.10"
hex = "0.4"

# IDs / time
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP client (version manifests, modrinth, adoptium, jar downloads)
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Static assets / misc
include_dir = "0.7"
mime_guess = "2"
once_cell = "1"
regex = "1"
which = "7"
tempfile = "3"
bytes = "1"

# System metrics
sysinfo = "0.33"

# Archives (backups, java runtimes, mrpack)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
md-5 = "0.10.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1

[profile.dev]
opt-level = 1
